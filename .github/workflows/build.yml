name: Build InVPN APK

on:
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VER: "1.25.10"
  SINGBOX_TAG: "v1.14.0-alpha.29"
  NDK_VER: "28.0.13004108"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Base64 of a .properties file with KEYSTORE_PASS / ALIAS_NAME / ALIAS_PASS.
      # getProps() in app/build.gradle.kts reads this -> enables stable release signing.
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Stable signing key so APKs install over the previous version without uninstall.
      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/release.keystore
          test -s app/release.keystore && echo "keystore restored ($(wc -c < app/release.keystore) bytes)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VER }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 36 + NDK + build-tools)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VER}"

      # Cache the gomobile-built libbox.aar — keyed on Go + sing-box tag.
      # Building it is the slow part (~minutes); a cache hit makes iterations fast.
      - name: Cache libbox.aar
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-aar-${{ runner.os }}-go${{ env.GO_VER }}-${{ env.SINGBOX_TAG }}

      - name: Build libbox.aar from sing-box (gomobile)
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VER}"
          export PATH="$PATH:$(go env GOPATH)/bin"
          git clone --depth 1 -b "${SINGBOX_TAG}" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          make lib_install
          make lib_android
          AAR="$(find . -name 'libbox.aar' -print -quit)"
          test -n "$AAR"
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Verify libbox.aar present
        run: ls -la app/libs/

      - name: Unit tests (crypto interop etc.)
        run: ./gradlew :app:testOtherDebugUnitTest --stacktrace --no-daemon

      - name: Build APK (other flavor / debug)
        run: ./gradlew :app:assembleOtherDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InVPN-other-debug
          path: app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
